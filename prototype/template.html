<style>
/* Layout: a phone-width app column (centred on desktop). Screens swap inside it; a bottom tab bar on the hub screens.

:root {

</style>

function draw(id, key, n) {
  const asked = S.asked[id + key] || [];
  const all = D[id][key].map((_, i) => i);
  const fresh = shuffle(all.filter(i => !asked.includes(i))), old = shuffle(all.filter(i => asked.includes(i)));
  return [...fresh, ...old].slice(0, n);
}
function newRun(id) {
  const st = dom(id);
  const items = [
    ...draw(id, "s1", 5).map(i => ({ s: 1, i })),
    ...draw(id, "s2", 4).map(i => ({ s: 2, i })),
    ...draw(id, "s3", 2).map(i => ({ s: 3, i }))
  ];
  st.scores = {}; st.why = {}; st.tensions = []; st.chosen = [];
  st.run = { items, pos: 0, stage: 0, gold: 2 + Math.floor(Math.random() * 7) };
  save();
}

/* ---------- questions ---------- */
function question(id) {
  const d = D[id], st = dom(id), run = st.run;

  const it = run.items[run.pos], stageIdx = it.s - 1;
  if (run.stage !== stageIdx) { run.stage = stageIdx; save(); }
  const isGold = run.pos === run.gold;

  document.getElementById("done").onclick = () => {
    const note = document.getElementById("cn").value.trim();
    S.notes.push({ v, task: V[v].challenge, note }); S.challenges++; save(); addCoins(100);
    toast(`כל הכבוד! הערך "${v}" צמח בגן`); setTimeout(() => go("garden"), 700);
  };
  const sw = (id, key) => { const b = document.getElementById(id); b.onclick = () => { r[key] = !r[key]; b.setAttribute("aria-checked", r[key]); save(); }; };
  sw("push", "push"); sw("mailsw", "mail");
  const upd = () => { document.getElementById("nextr").textContent = nextReminder(r); };
  document.getElementById("day").onchange = e => { r.day = e.target.value; save(); upd(); };
  document.getElementById("tm").onchange = e => { r.time = e.target.value; save(); upd(); };
  document.getElementById("test").onclick = () => notify(v);
  document.getElementById("cal").onclick = () => toast(`בגרסה המלאה ייווצר אירוע קבוע ביומן: כל יום ${r.day} בשעה ${r.time}`);
}

/* ---------- garden ---------- */
function flower(x, y, color, size, core, grow) {
  const petals = Array.from({ length: 6 }, (_, i) => `<ellipse cx="0" cy="${-size * .55}" rx="${size * .32}" ry="${size * .55}" transform="rotate(${i * 60})" fill="${color}" opacity=".95"/>`).join("");
  const h = size * 2.2 + grow * 6;
  return `<g transform="translate(${x} ${y})">
    <path d="M0 0 C1 ${-h * .4} -1 ${-h * .7} 0 ${-h}" stroke="#86935F" stroke-width="2" fill="none"/>
    <path d="M0 ${-h * .45} C-8 ${-h * .5} -12 ${-h * .62} -12 ${-h * .7} C-5 ${-h * .68} -1 ${-h * .58} 0 ${-h * .45}Z" fill="#9AAA7E"/>
    <g transform="translate(0 ${-h})">${petals}<circle r="${size * .3}" fill="${core ? "#B8935A" : "#F3E3C3"}" ${core ? 'stroke="#8C6B3A" stroke-width="1.5"' : ""}/></g></g>`;
}
function garden() {
  const fam = [...FAMILIES];
  const colors = ["#E8B9A4", "#B2BC92", "#A7B9C9", "#E6C1D0", "#D9C39A"];
  const items = [];
  doneDomains().forEach(d => S.domains[d.id].chosen.forEach(v => { if (!items.includes(v) && !S.core.includes(v)) items.push(v); }));
  const grow = Math.min(4, S.challenges);
  const W = 360, H = 260;
  const all = [...S.core.map(v => ({ v, core: true })), ...items.map(v => ({ v, core: false }))].slice(0, 18);
  const plants = all.map((p, i) => {
    const row = p.core ? 0 : 1 + Math.floor((i - S.core.length) / 6), col = p.core ? i : (i - S.core.length) % 6;
    const x = p.core ? 90 + col * 90 : 30 + col * 60 + (row % 2) * 18, y = p.core ? 160 : 190 + row * 22;
    const c = colors[fam.indexOf(V[p.v].family) % colors.length];
    return flower(x, y, c, p.core ? 15 : 11, p.core, p.core ? grow : 0);
  }).join("");
  const deco = (S.shop.includes("bench") ? `<g transform="translate(300 214)"><rect x="-22" y="-14" width="44" height="5" rx="2" fill="#A0805A"/><rect x="-20" y="-9" width="3" height="10" fill="#8C6B3A"/><rect x="17" y="-9" width="3" height="10" fill="#8C6B3A"/><rect x="-22" y="-24" width="44" height="4" rx="2" fill="#A0805A"/></g>` : "")
    + (S.shop.includes("butterflies") ? `<g fill="#C98E76" opacity=".85"><path d="M70 60 q-8 -8 -2 -12 q4 4 2 12 q6 -8 10 -4 q-4 6 -10 4Z"/><path d="M250 44 q-7 -7 -2 -10 q3 3 2 10 q5 -7 9 -3 q-4 5 -9 3Z" fill="#A7B9C9"/></g>` : "")
    + (S.shop.includes("lantern") ? `<g transform="translate(40 150)"><rect x="-1.5" y="0" width="3" height="60" fill="#5E554C"/><rect x="-7" y="-14" width="14" height="16" rx="3" fill="#F6E3B4" stroke="#8C6B3A"/><circle cx="0" cy="-6" r="10" fill="#FFF1CF" opacity=".5"/></g>` : "");
  render(`${topbar()}<span class="eyebrow">גן הערכים</span><h1>הגן ${S.name ? `של ${esc(S.name)}` : "שלך"}</h1>
    <div class="garden"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="גן הערכים: ${all.length} פרחים">
      <circle cx="300" cy="50" r="26" fill="#F6E3B4" opacity=".8"/>
      <path d="M0 196 C80 178 160 184 240 176 C300 170 340 178 360 174 L360 260 L0 260Z" fill="#E7DAC3"/>
      <path d="M0 214 C90 204 200 210 360 200 L360 260 L0 260Z" fill="#DCCBAE"/>
      ${deco}${plants}
      ${all.length ? "" : `<text x="180" y="120" text-anchor="middle" font-family="Assistant, sans-serif" font-size="15" fill="#7A7067">הגן מחכה לפרח הראשון</text>`}
    </svg></div>
    ${S.core.length ? `<div class="stages" aria-label="רמת הצמיחה של ערכי הליבה">${GROW.map(([i, n], k) => `<span class="${k === grow ? "on" : ""}"><i>${i}</i>${n}</span>`).join("")}</div>
      <p class="small muted">ערכי הליבה הם הפרחים הגדולים עם מרכז זהב. כל אתגר שבועי שמסומן ב־✓ מגדל אותם בשלב.</p>`
      : `<p class="small muted">כל קלף שנבחר בתחנה שותל פרח. ערכי הליבה מהמגדלור יהיו הפרחים הגדולים.</p>`}
    <div class="legend">${all.slice(0, 12).map(p => `<span>${V[p.v].icon} ${p.v}</span>`).join("")}</div>
    <h3>החנות של הגן</h3>
    <div class="shop">${SHOP.map(s => `<button class="item ${S.shop.includes(s.id) ? "owned" : ""}" type="button" data-buy="${s.id}"><span class="ii">${s.icon}</span>${s.name}<span class="price">${S.shop.includes(s.id) ? "בגן ✓" : `<span class="coin"></span>${s.price}`}</span></button>`).join("")}</div>`, { nav: true });
  app.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => {
    const s = SHOP.find(x => x.id === b.dataset.buy);
    if (S.shop.includes(s.id)) return toast(`ה${s.name} כבר בגן`);
    if (S.coins < s.price) return toast(`חסרים ${s.price - S.coins} מטבעות. אפשר להרוויח אותם בתחנות ובאתגרים`);
    S.coins -= s.price; S.shop.push(s.id); save(); toast(`${s.name} נוסף לגן`); garden();
  });
}

/* ---------- album ---------- */
function album() {
  const f = found();
  render(`${topbar()}<span class="eyebrow">אלבום קלפי הערכים</span><h1>התגלו ${f.size} מתוך ${DATA.values.length}</h1>
    <p class="muted small">קלף שהתגלה אפשר לפתוח ולקרוא. קלפים שעוד לא התגלו מחכים בהמשך המסע.</p>
    ${FAMILIES.map(fam => { const vs = DATA.values.filter(v => v.family === fam), n = vs.filter(v => f.has(v.name)).length;
      return `<div class="fam"><h3>${fam} <span class="small muted">${n}/${vs.length}</span></h3><div class="chips">${vs.map(v =>
        `<button class="vchip ${S.core.includes(v.name) ? "core" : f.has(v.name) ? "found" : "locked"}" type="button" data-v="${v.name}">${f.has(v.name) ? v.icon + " " : ""}${v.name}</button>`).join("")}</div></div>`; }).join("")}`, { nav: true });
  app.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    const v = V[b.dataset.v];
    if (!f.has(v.name)) return toast("הקלף הזה עוד לא התגלה. אולי הוא מחכה בתחנה הבאה");
    sheet(`<div style="display:flex;gap:10px;align-items:center"><span style="font-size:34px">${v.icon}</span><h2>${v.name}</h2></div>
      <div class="kv"><b>מה זה אומר</b><span>${v.desc}</span></div><div class="kv"><b>שאלה לרפלקציה</b><span>${v.reflect}</span></div>
      <div class="kv"><b>אתגר לדוגמה</b><span>${v.challenge}</span></div><span class="small muted">משפחת ${v.family}</span>`);
  });
}

/* ---------- summary ---------- */
function summary() {
  const dd = doneDomains();
  const counts = {}; dd.forEach(d => S.domains[d.id].chosen.forEach(v => counts[v] = (counts[v] || 0) + 1));
  const repeat = Object.entries(counts).filter(([, n]) => n > 1).sort((a, b) => b[1] - a[1]);
  const coachText = () => [`מסע הערכים${S.name ? " · " + S.name : ""}`,
    S.core.length ? `ערכי הליבה: ${S.core.join(", ")}` : "ערכי הליבה: עוד לא נקבעו",
    ...dd.map(d => `${d.name}: ${S.domains[d.id].chosen.join(", ")}`),
    ...dd.filter(d => S.domains[d.id].reflection).map(d => `רפלקציה (${d.name}): ${S.domains[d.id].reflection}`),
    `אתגרים שבוצעו: ${S.challenges}`].join("\n");
  render(`${topbar()}<span class="eyebrow">הפנקס שלי</span><h1>${S.name ? esc(S.name) + ", " : ""}כך נראה המסע עד עכשיו</h1>
    <div class="panel"><h3>ערכי הליבה</h3>${S.core.length ? `<div class="core3">${S.core.map((v, i) => `<div class="vcard"><span class="rank">${i + 1}</span><span class="vi">${V[v].icon}</span><span class="vn">${v}</span></div>`).join("")}</div>`
      : `<div class="empty"><p>יתגלו במגדלור, אחרי 3 תחנות.</p></div>`}</div>
    <div class="panel"><h3>הערכים לפי תחום</h3>${dd.length ? dd.map(d => `<div class="drow"><span>${d.icon} ${d.name}</span><span class="vals">${S.domains[d.id].chosen.join(" · ")}</span></div>`).join("")
      : `<div class="empty"><p>עוד לא הושלמה תחנה.</p><button class="btn small" type="button" id="m">למפה</button></div>`}</div>
    ${repeat.length ? `<div class="panel"><h3>ערכים שחוזרים</h3>${repeat.map(([v, n]) => `<p>${V[v].icon} <b>${v}</b> הופיע ב־${n} תחומים</p>`).join("")}</div>` : ""}
    ${dd.some(d => S.domains[d.id].reflection) ? `<div class="panel"><h3>הרפלקציות שלי</h3>${dd.filter(d => S.domains[d.id].reflection).map(d => `<div class="tension"><b>${d.name}${S.domains[d.id].reflectValue ? ` · ${S.domains[d.id].reflectValue}` : ""}</b><span>${esc(S.domains[d.id].reflection)}</span></div>`).join("")}</div>` : ""}
    <div class="panel"><h3>אתגרים</h3><p>${S.challenges ? `בוצעו ${S.challenges} אתגרים` : "עוד לא בוצע אתגר"}</p>${S.notes.slice(-3).map(n => `<div class="tension"><b>✓ ${n.v}</b><span>${n.task}${n.note ? ` · "${esc(n.note)}"` : ""}</span></div>`).join("")}</div>
    <button class="btn" type="button" id="copy">העתקת סיכום לשליחה למאמן</button>
    <pre id="ct" class="small" hidden style="white-space:pre-wrap;background:var(--paper);padding:12px;border-radius:12px;user-select:all">${esc(coachText())}</pre>
    <div class="panel"><h3>החשבון</h3>${user ? `<p>מחובר עם <b dir="ltr">${esc(user.email)}</b>. כל התקדמות נשמרת בענן.</p><button class="btn ghost" type="button" id="logout">יציאה מהחשבון</button>`
      : `<p class="small muted">${sb ? "אין חשבון מחובר, ולכן המסע נשמר רק בטלפון הזה." : "בסקיצה המסע נשמר רק בדפדפן הזה."}</p>${sb ? `<button class="btn ghost" type="button" id="login">כניסה עם מייל</button>` : ""}`}</div>
    <div class="panel" id="resetBox"><h3>מסע חדש</h3><p class="small muted">איפוס מתחיל מסע חדש מההתחלה. ${user ? "המסע הנוכחי נשמר בארכיון בענן, כדי שאפשר יהיה להשוות." : "בגרסה המחוברת המסע הנוכחי נשמר בארכיון, כדי שאפשר יהיה להשוות."}</p>
      <button class="btn ghost" type="button" id="reset">איפוס המסע</button></div>`, { nav: true });
  document.getElementById("m")?.addEventListener("click", () => go("map"));
  document.getElementById("login")?.addEventListener("click", () => go("account"));
  document.getElementById("logout")?.addEventListener("click", async () => { await sb.auth.signOut(); user = null; S.account = { type: "none" }; saveLocal(); toast("יצאת מהחשבון. המסע נשאר שמור בענן"); summary(); });
  document.getElementById("copy").onclick = () => {
    const show = () => { const p = document.getElementById("ct"); p.hidden = false; toast("הסיכום מוצג למטה, אפשר לסמן ולהעתיק"); };
    try { navigator.clipboard.writeText(coachText()).then(() => toast("הסיכום הועתק"), show); } catch (e) { show(); }
  };
  document.getElementById("reset").onclick = () => {
    document.getElementById("resetBox").innerHTML = `<h3>לאפס את המסע?</h3><p class="small muted">כל התשובות, הקלפים והמטבעות יימחקו מהסקיצה.</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn" type="button" id="yes">כן, לאפס</button><button class="btn ghost" type="button" id="no">ביטול</button></div>`;
    document.getElementById("yes").onclick = async () => {
      const keep = { account: S.account, name: S.name, coach: S.coach };
      if (sb && user) await sb.from("journeys").update({ active: false }).eq("id", S.journeyId);
      S = Object.assign(fresh(), keep); save(); go("welcome");
    };
    document.getElementById("no").onclick = () => summary();
  };
}

async function boot() {
  if (sb) {
    try {
      const { data } = await sb.auth.getSession();
      if (data.session?.user) await onSignedIn(data.session.user);
    } catch (e) {}
    sb.auth.onAuthStateChange((event, session) => {
      const u = session?.user;
      if (u && !user) onSignedIn(u).then(() => { go("map"); toast("נכנסת בהצלחה. המסע נשמר בענן"); });
      if (!u) user = null;
    });
  }
  go(S.started ? "map" : "welcome");
}
boot();
</script>
