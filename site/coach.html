<style>
/* Coach dashboard: summary row first, then the join code, then one card per trainee. Same sand palette as the app. */
:root {
  --sand: #FAF6F0; --sand-2: #F1E9DD; --paper: #FFFDF9; --ink: #403A33; --ink-soft: #7A7067; --line: #E6DCCD;
  --sage: #BFC8A4; --sage-deep: #5F7558; --rose: #EFC9B8; --rose-deep: #A37772; --sky: #A7B9C9; --gold: #B8935A; --gold-deep: #8C6B3A;
  --shadow: 0 1px 2px rgba(64,58,51,.08), 0 6px 18px rgba(64,58,51,.08);
  --font-display: "Frank Ruhl Libre", "David Libre", Georgia, serif;
  --font-body: "Assistant", "Heebo", "Segoe UI", Arial, sans-serif;
  color-scheme: only light;
}
* { box-sizing: border-box; }
html, body { background: var(--sand); }
body { margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 32px; } h2 { font-size: 22px; } h3 { font-size: 19px; }
p { margin: 0; }
.muted { color: var(--ink-soft); } .small { font-size: 14px; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--gold-deep); }
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.top img { width: 52px; height: 52px; border-radius: 14px; }
.top .who { margin-inline-start: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.panel { background: var(--paper); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.btn { appearance: none; border: 0; cursor: pointer; border-radius: 999px; padding: 11px 20px; font-weight: 800; background: var(--ink); color: var(--sand); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.gold { background: var(--gold); color: var(--paper); }
.btn.sm { padding: 7px 14px; font-size: 14px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
input { width: 100%; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 11px 13px; font: inherit; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--paper); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--ink-soft); font-weight: 700; }
.codes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.code { font-family: ui-monospace, Menlo, monospace; font-size: 18px; font-weight: 700; letter-spacing: .06em; background: var(--sand-2); border-radius: 10px; padding: 6px 12px; direction: ltr; }
.trainees { display: grid; gap: 14px; }
.tcard { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.thead { appearance: none; border: 0; background: none; width: 100%; text-align: right; cursor: pointer; padding: 16px 18px; display: grid; gap: 10px; }
.trow { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.trow h3 { margin-inline-end: auto; }
.pill { font-size: 12px; font-weight: 800; border-radius: 99px; padding: 2px 10px; background: var(--sand-2); color: var(--ink-soft); white-space: nowrap; }
.pill.ok { background: #DCE5D4; color: var(--sage-deep); }
.pill.warn { background: #F5E2D6; color: #8E5A4A; }
.bar { height: 8px; border-radius: 99px; background: var(--sand-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 14px; font-weight: 700; border-radius: 99px; padding: 3px 11px; background: var(--sage); }
.chip.core { background: var(--gold); color: var(--paper); }
.tbody { padding: 0 18px 18px; display: grid; gap: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
.tbody[hidden] { display: none; }
.kv { display: grid; gap: 6px; }
.kv > b { font-size: 13px; color: var(--gold-deep); }
.note { background: var(--sand); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.note b { display: block; font-size: 13px; color: var(--ink-soft); }
textarea { width: 100%; min-height: 300px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 12px; font: inherit; font-size: 15px; line-height: 1.5; resize: vertical; }
select { width: 100%; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 11px 13px; font: inherit; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: 14px; font-weight: 700; }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--gold-deep); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn.wa { background: #2E7D5B; color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.msg { white-space: pre-wrap; background: var(--sand); border-radius: 12px; padding: 10px 12px; font-size: 15px; user-select: all; }
.empty { text-align: center; padding: 26px; border: 1.5px dashed var(--line); border-radius: 18px; color: var(--ink-soft); display: grid; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--sand); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; z-index: 50; max-width: 90%; text-align: center; }
</style>
</head>
<body>
<div class="wrap" id="root"><p class="muted">טוענים...</p></div>
<script src="vendor/supabase-2.118.0.js"></script>
<script>
const CLOUD = {"url": "https://jilxleducctilebsvtlp.supabase.co", "key": "sb_publishable__4oLgDJ2EcgQIrXKABLs9w_HZtZJCs6"};
const SITE = location.origin + location.pathname.replace(/coach\.html$/, "");
const sb = window.supabase.createClient(CLOUD.url, CLOUD.key);
const root = document.getElementById("root");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(m) { document.querySelector(".toast")?.remove(); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
async function copy(text, okMsg) { try { await navigator.clipboard.writeText(text); toast(okMsg || "הועתק"); } catch (e) { toast("סמנו את הטקסט והעתיקו ידנית"); } }
function ago(iso) {
  if (!iso) return "עוד לא נכנס";
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 60) return m <= 1 ? "עכשיו" : `לפני ${m} דקות`;
  const h = Math.round(m / 60); if (h < 24) return h === 1 ? "לפני שעה" : `לפני ${h} שעות`;
  const d = Math.round(h / 24); return d === 1 ? "אתמול" : `לפני ${d} ימים`;
}
const header = (email) => `<div class="top"><img src="icons/icon-192.png" alt=""><div><span class="eyebrow">מסע הערכים</span><h1>לוח המאמן</h1></div>
  ${email ? `<div class="who"><span class="muted" dir="ltr">${esc(email)}</span><button class="btn ghost sm" id="out" type="button">יציאה</button></div>` : ""}</div>`;

/* ---------- login ---------- */
function loginView(sent) {
  root.innerHTML = header() + `<div class="panel" style="max-width:460px">
    ${sent ? `<h2>הלינק נשלח</h2><p>פותחים את המייל ולוחצים על הלינק. הוא יחזיר לכאן, ללוח המאמן.</p>`
      : `<h2>כניסה למאמנים</h2><p class="muted">נכנסים עם אותו מייל שהוגדר כחשבון מאמן.</p>
        <label for="em" class="small" style="font-weight:700">מייל</label><input id="em" type="email" dir="ltr" autocomplete="email" placeholder="name@example.com">
        <button class="btn" id="send" type="button">שליחת לינק כניסה</button>`}</div>`;
  document.getElementById("send")?.addEventListener("click", async () => {
    const em = document.getElementById("em").value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast("צריך כתובת מייל מלאה");
    const { error } = await sb.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: false } });
    if (error) return toast(/rate|limit/i.test(error.message) ? "נשלחו יותר מדי לינקים. כדאי לנסות שוב בעוד כמה דקות" : "השליחה לא הצליחה. האם המייל הזה נכנס פעם לאפליקציה?");
    loginView(true);
  });
}

/* ---------- dashboard ---------- */
async function dashboard(user) {
  const { data: me } = await sb.from("profiles").select("role").eq("id", user.id).maybeSingle();
  if (me?.role !== "coach") {
    root.innerHTML = header(user.email) + `<div class="panel"><h2>החשבון הזה עוד לא מוגדר כמאמן</h2>
      <p>כדי להפוך אותו לחשבון מאמן, מריצים פעם אחת ב־Supabase את הקוד שבסוף הקובץ <b>supabase/schema-coach.sql</b>, עם המייל <b dir="ltr">${esc(user.email)}</b>.</p></div>`;
    bindOut(); return;
  }
  const [{ data: codes }, { data: rows, error }] = await Promise.all([
    sb.from("coach_codes").select("code,created_at").order("created_at"),
    sb.from("profiles").select("id,name,email,coach_code,summary,share_reflections,last_active,push_enabled,reminder_day,reminder_time,next_challenge_value,next_challenge,challenges_done").neq("id", user.id)
  ]);
  if (error) { root.innerHTML = header(user.email) + `<div class="panel"><h2>לא הצלחנו לטעון את המתאמנים</h2><p class="muted">${esc(error.message)}</p></div>`; bindOut(); return; }
  const list = (rows || []).sort((a, b) => Date.parse(b.last_active || 0) - Date.parse(a.last_active || 0));
  const week = Date.now() - 7 * 864e5;
  const active = list.filter(t => t.last_active && Date.parse(t.last_active) > week).length;
  const withCore = list.filter(t => t.summary?.core?.length).length;
  const challenges = list.reduce((n, t) => n + (t.challenges_done || 0), 0);
  const DAYS = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
  const invite = (c, name, pilot) => [
    `היי${name ? " " + name : ""} 😊`,
    `הזמנתי אותך ל*מסע הערכים* 🧭`,
    `זה משחק קצר בטלפון שעוזר לגלות מה הכי חשוב לך בכל תחום בחיים: משפחה, זוגיות, עבודה, חברים ועוד.`,
    ``,
    `*איך מתחילים:*`,
    `1. פותחים את הלינק ב־Chrome או ב־Safari:`,
    SITE,
    `2. כותבים שם ולוחצים "יוצאים לדרך".`,
    `3. במסך "שומרים את המסע" כותבים את המייל ואת קוד ההצטרפות: *${c}*`,
    `4. מגיע מייל עם לינק כניסה, לוחצים עליו ונכנסים. אם המייל לא הגיע, כדאי לבדוק בספאם.`,
    ``,
    `*כדאי לדעת:*`,
    `⏱️ כל תחנה במפה לוקחת בערך 7 דקות. אפשר לעצור ולהמשיך מתי שרוצים.`,
    `🔔 במסך "אתגר" אפשר להפעיל תזכורת שבועית לטלפון.`,
    `📱 באייפון: כדי לקבל תזכורות, קודם מוסיפים את האתר למסך הבית (כפתור השיתוף ב־Safari ← "הוספה למסך הבית").`,
    `🔒 אני רואה רק את הערכים שבחרת ואת ההתקדמות. את מה שכתבת אראה רק אם בוחרים לשתף.`,
    ...(pilot ? [``, `זו גרסה ראשונה, ואני בודקת אותה עם כמה אנשים. כל הערה תעזור לי: מה היה נעים, מה לא היה ברור, ומה חסר.`] : []),
    ``,
    `אשמח לשמוע מה דעתך אחרי התחנה הראשונה 💛`
  ].join("\n");
  const waPhone = p => { const d = (p || "").replace(/\D/g, ""); return d.startsWith("0") ? "972" + d.slice(1) : d; };
  const weekly = t => `היי${t.name ? " " + t.name : ""}, האתגר השבועי שלך במסע הערכים (${t.next_challenge_value}):\n${t.next_challenge}\nאשמח לשמוע איך היה!`;

  root.innerHTML = header(user.email) + `
    <div class="stats">
      <div class="stat"><b>${list.length}</b><span>מתאמנים</span></div>
      <div class="stat"><b>${active}</b><span>פעילים השבוע</span></div>
      <div class="stat"><b>${withCore}</b><span>גילו ערכי ליבה</span></div>
      <div class="stat"><b>${challenges}</b><span>אתגרים שבוצעו</span></div>
    </div>
    <div class="panel"><h2>קוד הצטרפות</h2>
      <p class="muted small">מתאמן שמכניס את הקוד באפליקציה מופיע כאן. אפשר לשלוח את ההזמנה ב־WhatsApp.</p>
      <div class="codes">${(codes || []).map(c => `<span class="code">${esc(c.code)}</span>`).join("") || '<span class="muted">עוד אין קוד. יוצרים קוד, ואז מכינים הזמנה.</span>'}
        <button class="btn gold sm" type="button" id="newCode">יצירת קוד חדש</button></div></div>
    ${(codes || []).length ? `<div class="panel" id="inviteBox"><h2>הזמנה למתאמן</h2>
      <p class="muted small">ממלאים, בודקים את הנוסח ושולחים. אפשר לשנות כל מילה בהודעה לפני השליחה.</p>
      <div class="grid2">
        <div class="field"><label for="icode">קוד הצטרפות</label><select id="icode">${codes.map(c => `<option>${esc(c.code)}</option>`).join("")}</select></div>
        <div class="field"><label for="iname">שם המתאמן (לא חובה)</label><input id="iname" placeholder="לדוגמה: נועה"></div>
        <div class="field"><label for="iphone">טלפון לשליחה ישירה (לא חובה)</label><input id="iphone" type="tel" inputmode="tel" dir="ltr" placeholder="050-1234567"></div>
      </div>
      <label class="check"><input type="checkbox" id="ipilot"> להוסיף פסקה על פיילוט ובקשה למשוב</label>
      <div class="field"><label for="itext">ההודעה</label><textarea id="itext"></textarea></div>
      <div class="actions"><a class="btn wa" id="isend" href="#" target="_blank" rel="noopener">שליחה ב־WhatsApp</a>
        <button class="btn ghost" type="button" id="icopy">העתקת ההודעה</button>
        <button class="btn ghost" type="button" id="ireset">חזרה לנוסח המקורי</button></div>
      <p class="small muted">בלי מספר טלפון, WhatsApp ייפתח ותבחרו למי לשלוח. במספר ישראלי אפשר לכתוב 05X כרגיל.</p>
    </div>` : ""}
    <h2>המתאמנים</h2>
    <div class="trainees">${list.length ? list.map((t, i) => {
      const s = t.summary || {}, pct = Math.round(((s.stations || 0) / (s.total || 8)) * 100);
      return `<article class="tcard"><button class="thead" type="button" data-open="${i}" aria-expanded="false">
        <div class="trow"><h3>${esc(t.name || "ללא שם")}</h3>
          <span class="pill ${t.push_enabled ? "ok" : "warn"}">${t.push_enabled ? "תזכורות פעילות" : "בלי תזכורות"}</span>
          <span class="pill">${ago(t.last_active)}</span></div>
        <div class="trow small muted"><span>${s.stations || 0} מתוך ${s.total || 8} תחנות</span><span>·</span><span>${t.challenges_done || 0} אתגרים</span>${s.inProgress?.length ? `<span>·</span><span>באמצע: ${esc(s.inProgress.join(", "))}</span>` : ""}</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        ${s.core?.length ? `<div class="chips">${s.core.map(v => `<span class="chip core">${esc(v)}</span>`).join("")}</div>` : '<span class="small muted">ערכי הליבה עוד לא נבחרו</span>'}
      </button>
      <div class="tbody" id="tb${i}" hidden>
        ${t.email ? `<p class="small muted" dir="ltr" style="text-align:right">${esc(t.email)}</p>` : ""}
        <div class="kv"><b>הערכים לפי תחום</b>${(s.domains || []).map(d => `<div class="note"><b>${esc(d.icon)} ${esc(d.name)}</b>${esc(d.values.join(" · "))}${d.tensions?.length ? `<div class="small muted">${d.tensions.map(esc).join("<br>")}</div>` : ""}</div>`).join("") || '<span class="small muted">עוד לא הושלמה תחנה.</span>'}</div>
        <div class="kv"><b>רפלקציות</b>${t.share_reflections ? ((s.reflections || []).map(r => `<div class="note"><b>${esc(r.domain)}${r.value ? " · " + esc(r.value) : ""}</b>${esc(r.text)}</div>`).join("") || '<span class="small muted">עוד לא נכתבו רפלקציות.</span>') : '<span class="small muted">המתאמן בחר לא לשתף את הרפלקציות.</span>'}</div>
        <div class="kv"><b>אתגרים</b>${(s.notes || []).slice().reverse().map(n => `<div class="note"><b>✓ ${esc(n.v)}</b>${esc(n.task)}${n.note ? `<div>"${esc(n.note)}"</div>` : ""}</div>`).join("") || '<span class="small muted">עוד לא בוצע אתגר.</span>'}</div>
        <div class="kv"><b>תזכורת</b><span class="small">${t.reminder_day != null && t.reminder_time ? `כל יום ${DAYS[t.reminder_day]} בשעה ${esc(t.reminder_time)}` : "לא נקבעה"}</span></div>
        ${t.next_challenge ? `<div class="kv"><b>הודעה שבועית לשליחה ב־WhatsApp</b><div class="msg">${esc(weekly(t))}</div><button class="btn ghost sm" type="button" data-msg="${i}" style="justify-self:start">העתקת ההודעה</button></div>` : ""}
      </div></article>`;
    }).join("") : `<div class="empty"><b>עוד אין מתאמנים</b><span>שולחים למתאמנים את ההזמנה עם קוד ההצטרפות. ברגע שהם נכנסים עם הקוד, הם מופיעים כאן.</span></div>`}</div>`;

  bindOut();
  const box = document.getElementById("inviteBox");
  if (box) {
    const $ = id => document.getElementById(id);
    let edited = false;
    const fill = () => { if (!edited) $("itext").value = invite($("icode").value, $("iname").value.trim(), $("ipilot").checked); link(); };
    const link = () => { const ph = waPhone($("iphone").value); $("isend").href = `https://wa.me/${ph}?text=${encodeURIComponent($("itext").value)}`; };
    ["icode", "ipilot"].forEach(id => $(id).addEventListener("change", fill));
    $("iname").addEventListener("input", fill);
    $("iphone").addEventListener("input", link);
    $("itext").addEventListener("input", () => { edited = true; link(); });
    $("ireset").onclick = () => { edited = false; fill(); toast("חזרנו לנוסח המקורי"); };
    $("icopy").onclick = () => copy($("itext").value, "ההודעה הועתקה");
    fill();
  }
  root.querySelectorAll("[data-msg]").forEach(b => b.onclick = () => copy(weekly(list[+b.dataset.msg]), "ההודעה הועתקה"));
  root.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    const body = document.getElementById("tb" + b.dataset.open), open = body.hidden;
    body.hidden = !open; b.setAttribute("aria-expanded", open);
  });
  document.getElementById("newCode").onclick = async () => {
    const abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    const code = "MASA-" + Array.from(crypto.getRandomValues(new Uint8Array(4)), n => abc[n % abc.length]).join("");
    const { error } = await sb.from("coach_codes").insert({ code, coach_id: user.id });
    if (error) return toast("יצירת הקוד לא הצליחה. כדאי לנסות שוב");
    toast("נוצר קוד " + code); dashboard(user);
  };
}
function bindOut() { document.getElementById("out")?.addEventListener("click", async () => { await sb.auth.signOut(); loginView(); }); }

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session?.user) dashboard(data.session.user); else loginView();
  sb.auth.onAuthStateChange((ev, session) => { if (ev === "SIGNED_IN" && session?.user) dashboard(session.user); });
})();
</script>
</body>
